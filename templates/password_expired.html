<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Expired - ChargeShield AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            min-height: 100vh; margin: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 26px; padding: 40px 20px;
            background: linear-gradient(180deg, var(--c-fff1e6, #fff1e6) 0%, var(--page-bg, #fdf8f4) 55%, var(--page-bg, #fdf8f4) 100%);
        }
        .pw-card {
            width: 100%; max-width: 440px; background: var(--surface, #fff);
            border: 1px solid var(--line, #f2e4da);
            border-left: 5px solid #b45309;
            border-radius: 16px; box-shadow: 0 6px 26px rgba(146, 64, 14, .12);
            padding: 32px 36px;
        }
        .pw-card h1 { font-size: 19px; margin: 0 0 6px; color: var(--ink, #2b1b12); }
        .pw-card .sub { font-size: 13px; color: var(--ink-soft, #8a7365); margin-bottom: 20px; line-height: 1.55; }
        .pw-age {
            display: inline-block; font-size: 11px; font-weight: 800; text-transform: uppercase;
            letter-spacing: .4px; background: #fff4e5; color: #b45309;
            padding: 4px 11px; border-radius: 999px; margin-bottom: 16px;
        }
        .pw-card label { display: block; font-size: 12px; font-weight: 700; margin: 0 0 4px; color: var(--ink, #2b1b12); }
        .pw-card input {
            width: 100%; box-sizing: border-box; font: inherit; font-size: 13.5px;
            padding: 10px 12px; margin-bottom: 14px; border-radius: 9px;
            border: 1px solid var(--line-strong, #fbd9c4); background: var(--surface, #fff);
        }
        .pw-card input:focus { outline: 2px solid rgba(244, 97, 26, .3); outline-offset: -1px; }
        .pw-go {
            width: 100%; padding: 11px; border: none; border-radius: 9px; cursor: pointer;
            background: var(--brand, #f4611a); color: var(--on-accent, #fff); font-size: 13.5px; font-weight: 700;
        }
        .pw-go:hover { background: var(--brand-dark, #c2410c); }
        .pw-err {
            background: #fdeceb; color: #c62828; font-size: 12.5px; font-weight: 600;
            padding: 9px 12px; border-radius: 8px; margin-bottom: 14px;
        }
        .pw-out { margin-top: 16px; text-align: center; }
        .pw-out button {
            background: none; border: none; color: var(--ink-soft, #8a7365);
            font: inherit; font-size: 12px; cursor: pointer; text-decoration: underline;
        }
    </style>
</head>
<body>
    <form class="pw-card" method="post">
        <span class="pw-age">{{ age }} days old &middot; policy is {{ max_age }}</span>
        <h1>Choose a new password</h1>
        <div class="sub">
            This account's password is past the {{ max_age }}-day policy. Set a new one to carry on
            &mdash; nothing else opens until you do.
        </div>

        {% if error %}<div class="pw-err">{{ error }}</div>{% endif %}

        <label for="current">Current password</label>
        <input id="current" name="current" type="password" autocomplete="current-password" required autofocus>

        <label for="new">New password</label>
        <input id="new" name="new" type="password" autocomplete="new-password"
               minlength="{{ min_password }}" required
               placeholder="At least {{ min_password }} characters">

        <label for="confirm">Confirm new password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password"
               minlength="{{ min_password }}" required>

        <button class="pw-go" type="submit">Set password and continue</button>

        <div class="pw-out">
            <button type="submit" formmethod="post" formaction="{{ url_for('logout') }}"
                    formnovalidate>Sign out instead</button>
        </div>
    </form>
</body>
</html>
